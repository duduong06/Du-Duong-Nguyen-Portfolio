<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du Duong Nguyen Portfolio</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="top">
        <nav class="navbar">
            <div class="logo">Portfolio</div>

            <!-- hidden checkbox controls menu -->
            <input type="checkbox" id="menu-toggle">
            <div class="menu-wrapper">
                <label for="menu-toggle" class="menu-icon">
                    <img src="./assets/images/menu.png" alt="menu" class="menu-icon">
                </label>
                
                <ul class="nav-links">
                    <a href="https://duduong06.github.io/Du-Duong-Nguyen-Portfolio/">Home</a>
                    <a href="project.html">Projects</a>
                    <a href="contact.html">Contacts</a>
                </ul>
            </div>
        </nav>
    </header>
    
    <div class="carousel">

        <!-- Hidden controls -->
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">

        <!-- Board -->
        <div class="carousel-window">
            <div class="carousel-track">

                <!-- First slide -->
                <div class="slide">
                    <h1>Hi, I'm Du Duong Nguyen</h1>
                    <p>Software Engineer</p>
                </div>

                <!-- Second slide -->
                <div class="slide">
                    <h1>View My Resume</h1>
                    <a href="assets/images/Du Duong Nguyen resume.pdf" target="_blank">
                        Here
                    </a>
                </div>

            </div>
        </div>

        <!-- Dot menu -->
        <div class="dots">
            <label for="slide1" class="dot"></label>
            <label for="slide2" class="dot"></label>
        </div>

    </div>

    <div class="background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
    </div>

</body>
</html>
